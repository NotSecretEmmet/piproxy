daemon
nserver 8.8.8.8
nserver 8.8.4.4
nscache 65536
timeouts 1 5 30 60 180 15 60

# Logging
log /usr/local/3proxy/logs/3proxy.log D
logformat "- +_L%t.%. %n.%p %E %U %C:%c %R:%r"

# User setup
auth strong
users admin:CL:admin


proxy -p3128 -Deusb0
flush

proxy -p3129 -Deusb1
flush

proxy -p3130 -Deusb2
flush


#allow admin
admin -p8080

